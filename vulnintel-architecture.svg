<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00f5d4"/>
    </marker>
  </defs>

  <!-- Source -->
  <rect x="360" y="20" width="240" height="56" rx="12" fill="#111827" stroke="#00f5d4" stroke-width="2"/>
  <text x="480" y="45" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">NVD API</text>
  <text x="480" y="64" text-anchor="middle" fill="#9ca3af" font-size="12">~82,000 CVE records (2023–2025)</text>

  <line x1="480" y1="76" x2="480" y2="112" stroke="#00f5d4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Ingestion / Preprocessing -->
  <rect x="330" y="112" width="300" height="56" rx="12" fill="#111827" stroke="#00f5d4" stroke-width="2"/>
  <text x="480" y="137" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Data Ingestion &amp; Preprocessing</text>
  <text x="480" y="156" text-anchor="middle" fill="#9ca3af" font-size="12">Cleaning, filtering, feature extraction</text>

  <!-- Split lines -->
  <line x1="480" y1="168" x2="480" y2="196" stroke="#00f5d4" stroke-width="2"/>
  <line x1="230" y1="196" x2="730" y2="196" stroke="#00f5d4" stroke-width="2"/>
  <line x1="230" y1="196" x2="230" y2="222" stroke="#00f5d4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="196" x2="730" y2="222" stroke="#00f5d4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Discovery Engine -->
  <rect x="80" y="222" width="300" height="90" rx="14" fill="#0b1120" stroke="#00f5d4" stroke-width="2"/>
  <text x="230" y="250" text-anchor="middle" fill="#00f5d4" font-size="16" font-weight="700">Discovery Engine (VDE)</text>
  <text x="230" y="272" text-anchor="middle" fill="#d1d5db" font-size="13">Autoencoder + HDBSCAN</text>
  <text x="230" y="292" text-anchor="middle" fill="#9ca3af" font-size="12">Unsupervised threat clustering</text>

  <!-- Guardian Engine -->
  <rect x="580" y="222" width="300" height="90" rx="14" fill="#0b1120" stroke="#00f5d4" stroke-width="2"/>
  <text x="730" y="250" text-anchor="middle" fill="#00f5d4" font-size="16" font-weight="700">Guardian Engine (VGE)</text>
  <text x="730" y="272" text-anchor="middle" fill="#d1d5db" font-size="13">Autoencoder + GMM</text>
  <text x="730" y="292" text-anchor="middle" fill="#9ca3af" font-size="12">Static risk scoring (Low/Med/High)</text>

  <line x1="230" y1="312" x2="230" y2="346" stroke="#00f5d4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="312" x2="730" y2="346" stroke="#00f5d4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Outputs -->
  <rect x="80" y="346" width="300" height="60" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="230" y="371" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">8 Threat Clusters</text>
  <text x="230" y="390" text-anchor="middle" fill="#9ca3af" font-size="12">Silhouette score ≈ 0.27</text>

  <rect x="580" y="346" width="300" height="60" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="730" y="371" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">Risk-Tiered CVEs</text>
  <text x="730" y="390" text-anchor="middle" fill="#9ca3af" font-size="12">Prioritized vulnerability scoring</text>

  <!-- Merge into dashboard -->
  <line x1="230" y1="406" x2="230" y2="428" stroke="#00f5d4" stroke-width="2"/>
  <line x1="730" y1="406" x2="730" y2="428" stroke="#00f5d4" stroke-width="2"/>
  <line x1="230" y1="428" x2="730" y2="428" stroke="#00f5d4" stroke-width="2"/>
  <line x1="480" y1="428" x2="480" y2="454" stroke="#00f5d4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Dashboard -->
  <rect x="280" y="454" width="400" height="90" rx="14" fill="#111827" stroke="#00f5d4" stroke-width="2"/>
  <text x="480" y="480" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Async Django Dashboard</text>
  <text x="480" y="502" text-anchor="middle" fill="#d1d5db" font-size="12">CVE Lookup · Cluster Visualization</text>
  <text x="480" y="520" text-anchor="middle" fill="#d1d5db" font-size="12">Automated Report Export</text>
</svg>
